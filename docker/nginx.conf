# ---------------------------------------------------------------------------
# Sista Bussen — nginx server block for the runtime image.
#
# This file is copied to /etc/nginx/conf.d/default.conf. The nginx:alpine base
# config already provides events{} / http{} and includes conf.d/*.conf, so this
# file holds only the server block.
#
# TLS is terminated by Coolify's Traefik proxy; this container listens on plain
# HTTP port 80.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Complete extension -> MIME map from the base image. Without this, SVG,
    # woff2 and friends fall through to default_type.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # --- Never cache these -------------------------------------------------
    # A stale sw.js is how an installed PWA gets stuck on an old build, and a
    # stale index.html points at assets that no longer exist.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # .webmanifest is not reliably covered by the base image's mime.types, so
    # the type is pinned here instead of relying on it.
    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # --- Fingerprinted build output ---------------------------------------
    # Vite hashes every filename under /assets/, so the content behind a URL
    # never changes. `^~` keeps this prefix match ahead of the regex locations
    # below for png/svg emitted into /assets/.
    location ^~ /assets/ {
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            image/png png;
            image/webp webp;
            image/avif avif;
            image/gif gif;
            image/x-icon ico;
            font/woff woff;
            font/woff2 woff2;
            application/json json;
            text/plain txt;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Icons -------------------------------------------------------------
    # Root-level icons are not fingerprinted, so a day rather than immutable.
    location ~* \.(png|svg)$ {
        types {
            image/png png;
            image/svg+xml svg;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # --- SPA ---------------------------------------------------------------
    # Deep links resolve to the app shell; try_files' last argument is an
    # internal redirect, so index.html is served as text/html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0e12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sista Bussen" />
    <meta name="description" content="Sista Bussen — överlev till 03:00. Ett survivor-spel på busshållplatsen." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <title>SISTA BUSSEN</title>
    <style>
      /* Boot screen — inline so the first paint is styled before any module executes.
         The build injects the version text (vite.config.ts); main.ts removes the node as
         soon as the menu can render. If JS never arrives, the moving progress bar and the
         delayed hint still make the screen look intentional. */
      html {
        background: #05070a;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #10161e 0%, #070a0e 60%, #05070a 100%);
        color: #eaf1f8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        text-align: center;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .boot-sign {
        position: relative;
        width: 44px;
        height: 68px;
        animation: boot-breathe 2.4s ease-in-out infinite;
      }
      .boot-sign__disc {
        position: absolute;
        top: 0;
        left: 2px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #f5a524;
        background: #10161e;
        box-sizing: border-box;
      }
      .boot-sign__disc::after {
        content: '';
        position: absolute;
        inset: 9px;
        border-radius: 50%;
        background: #f5a524;
        opacity: 0.85;
      }
      .boot-sign__post {
        position: absolute;
        top: 36px;
        left: 19px;
        width: 6px;
        height: 32px;
        border-radius: 3px;
        background: #27313d;
      }
      .boot__title {
        margin: 0;
        font-size: clamp(22px, 7vw, 34px);
        font-weight: 800;
        letter-spacing: 0.28em;
        padding-left: 0.28em;
      }
      .boot__version {
        margin-top: -10px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        color: #93a3b5;
        text-transform: lowercase;
      }
      .boot__track {
        position: relative;
        width: 70px;
        height: 3px;
        border-radius: 2px;
        background: #27313d;
        overflow: hidden;
      }
      .boot__runner {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 2px;
        background: #f5a524;
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      .boot__hint {
        font-size: 12px;
        letter-spacing: 0.1em;
        color: #66748a;
      }
      .boot__slow {
        opacity: 0;
        font-size: 12px;
        color: #93a3b5;
        animation: boot-slow-in 420ms ease-out 8s forwards;
      }
      #boot.boot--out {
        opacity: 0;
        transition: opacity 200ms ease-out;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 0.82;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      @keyframes boot-slow-in {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status">
      <div class="boot-sign" aria-hidden="true">
        <div class="boot-sign__disc"></div>
        <div class="boot-sign__post"></div>
      </div>
      <h1 class="boot__title">SISTA BUSSEN</h1>
      <div id="boot-version" class="boot__version">[SB_BOOT_VERSION]</div>
      <div class="boot__track" aria-hidden="true"><div class="boot__runner"></div></div>
      <div class="boot__hint">hållplatsen · 23:00–03:00</div>
      <div class="boot__slow">Laddar långsamt — kontrollera uppkopplingen</div>
    </div>
    <div id="app">
      <div id="stage-frame" class="stage-frame">
        <canvas id="stage" aria-label="Spelplan: busshållplatsen"></canvas>
        <div id="ui" class="ui-root"></div>
      </div>
      <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

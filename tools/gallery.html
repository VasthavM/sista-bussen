<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>SISTA BUSSEN — sprite gallery</title>
    <style>
      html,
      body {
        margin: 0;
        background: #070a0d;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="gallery" width="1760" height="780"></canvas>
    <script type="module">
      import { drawSpriteGallery } from '/src/render/entities.ts';

      const canvas = document.getElementById('gallery');
      const ctx = canvas.getContext('2d');
      // 1 buffer pixel per CSS pixel, so the 2x row really is 2x in the file.
      drawSpriteGallery(ctx, 1760, 780);
      window.__galleryReady = true;
    </script>
  </body>
</html>
